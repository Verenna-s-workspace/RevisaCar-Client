# Blueprint do Render — backend (Django/Docker) + frontend (Vite/Static Site).
# No Render: New → Blueprint → aponta pro repo. Ele lê este arquivo e cria os dois
# serviços já configurados. Preencha os envs marcados com sync:false (segredos).
services:
  # ── Backend: API Django ────────────────────────────────────────────────────
  - type: web
    name: revisacar-customer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: ohio          # mesma região do Supabase (us-east-2) — menor latência
    plan: free            # sobe pra 'starter' se não quiser o spin-down do free
    branch: main
    healthCheckPath: /api/
    # As migrações rodam no boot (backend/start.sh) — o free tier do Render não
    # suporta preDeployCommand. migrate é idempotente.
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true            # o Render gera um segredo forte
      - key: REFRESH_COOKIE_SAMESITE
        value: None                    # cross-site (front num domínio diferente)
      - key: REFRESH_COOKIE_SECURE
        value: "True"
      # Origem do front (mesmo blueprint) liberada no CORS automaticamente.
      # property:host dá só o hostname (sem https://) — settings.py prefixa o scheme.
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: revisacar-customer-web
          property: host               # ex.: revisacar-customer-web.onrender.com
      - key: FRONTEND_URL
        fromService:
          type: web
          name: revisacar-customer-web
          property: host
      # ── Preencher no painel (segredo) ────────────────────────────────────────
      - key: DATABASE_URL
        sync: false                    # connection string do Supabase (pooler :5432)
      # ── Opcionais (ligam features env-gated quando você tiver as chaves) ──────
      # - key: USE_S3            (+ AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_STORAGE_BUCKET_NAME / AWS_S3_ENDPOINT_URL)
      # - key: PLATE_LOOKUP_URL  (+ PLATE_LOOKUP_TOKEN / PLATE_LOOKUP_MAP)
      # - key: VAPID_PUBLIC_KEY  (+ VAPID_PRIVATE_KEY / VAPID_SUBJECT)
      # - key: EMAIL_HOST        (+ EMAIL_HOST_USER / EMAIL_HOST_PASSWORD)

  # ── Frontend: PWA React/Vite (site estático + CDN) ──────────────────────────
  - type: web
    name: revisacar-customer-web
    runtime: static
    rootDir: frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: toda rota cai no index.html (equivalente ao rewrite do vercel.json).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # sw.js / push-sw.js nunca podem ficar em cache (workbox atualiza o PWA).
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /push-sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      # URL da API do backend, lida em build pelo Vite (src/services/api.ts).
      # Preencha no painel após o backend subir: https://<host-do-backend>/api
      # (ex.: https://revisacar-customer-api.onrender.com/api — com /api, sem barra
      # final). Não dá pra auto-derivar no blueprint porque o Vite precisa da URL
      # completa (com https:// e /api) em tempo de build.
      - key: VITE_API_URL
        sync: false
      # Produção real: sem mocks, sem telas de vitrine (não setar VITE_BYPASS_LOGIN
      # nem VITE_SHOWCASE). VITE_SENTRY_DSN opcional.
