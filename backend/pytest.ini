[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = customer_api/tests
addopts = -q

# Env dummy para o settings importar nos testes (nenhum teste faz rede/banco).
env =
    DJANGO_SECRET_KEY=test-secret-key-not-for-production
    DEBUG=True
    SUPABASE_URL=https://dummy.supabase.co
    SUPABASE_KEY=dummy-key-for-tests
